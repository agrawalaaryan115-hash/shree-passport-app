<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Studio - Passport Photo Maker</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
    /* स्क्रीन पर फोटो को पासपोर्ट साइज ग्रिड में रखने का इंजन */
    /* [FIX] "1fr" हटाया — पहले column stretch होकर फोटो को बड़ा दिखा रहा था।
       [FIX] cm/mm की जगह px use किया क्योंकि browser इन्हें हमेशा 96dpi मानकर
       convert करता है, जिससे अलग-अलग मॉनिटर पर साइज असली से बड़ा/छोटा दिख सकता था।
       3.5cm ≈ 132px, 4.5cm ≈ 170px (96dpi हिसाब से) — यह सिर्फ ON-SCREEN PREVIEW के
       लिए है, प्रिंट पर कोई असर नहीं पड़ेगा (नीचे @media print में असली mm साइज़ है) */
#printSheet {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, 113px) !important;
    gap: 5px !important;
    justify-content: center !important;
    align-content: start !important;
    width: 100% !important;
    max-width: 210mm !important; /* A4 की चौड़ाई स्क्रीन पर */
    background: #ffffff !important;
    padding: 20px !important;
    box-sizing: border-box !important;
}

/* हर एक फोटो का साइज स्क्रीन पर पासपोर्ट साइज लॉक करने के लिए (30mm ≈ 113px, 40mm ≈ 151px) */
.grid-photo-item {
    width: 113px !important;
    height: 151px !important;
    border: 1px solid #000 !important;
    box-sizing: border-box !important;
    background-size: cover !important;
    background-position: center !important;
}

.grid-photo-item img {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
}

    /* 1. स्क्रीन पर आपके पुराने प्रोफेशनल लेआउट को वापस लाने का कोड */
    .container, .main-layout {
        display: grid !important;
        grid-template-columns: 1fr 350px !important; /* A4 शीट लेफ्ट में और टूल्स राइट में */
        gap: 20px !important;
        padding: 20px !important;
    }

    .sidebar-tools, .control-panel {
        display: flex !important;
        flex-direction: column !important;
    }

    /* प्रिंटर को बताना कि पेज A4 है और कोई extra browser margin नहीं चाहिए */
    @page {
        size: A4;
        margin: 0;
    }

    /* केवल और केवल प्रिंटर मशीन के लिए (Ctrl+P दबाने पर) */
    @media print {
        body, html {
            margin: 0 !important;
            padding: 0 !important;
            background: #ffffff !important;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        
        /* ए4 साइज की शीट पर फोटो को 6 की लाइन में सेट करने का इंजन (42 फोटो = 6x7, न्यूनतम gap) */
        #printSheet {
            width: 210mm !important;
            height: 297mm !important;
            margin: 0 !important;
            padding: 3mm !important; /* [UPDATED] 5mm से घटाकर 3mm — ज़्यादा फोटो फिट होंगी */
            box-sizing: border-box !important;
            display: grid !important;
            /* [UPDATED] 6 कॉलम का ग्रिड — चौड़ाई 30mm फिक्स रखी है */
            grid-template-columns: repeat(6, 30mm) !important; 
            grid-auto-rows: 40mm !important; /* [UPDATED] 45mm से घटाकर 40mm — 7 rows फिट करने के लिए */
            gap: 1mm 1mm !important; /* [UPDATED] 3mm/2mm से घटाकर 1mm — धागे जैसा पतला gap, सिर्फ कटिंग लाइन के लिए */
            justify-content: center !important;
            align-content: start !important;
            overflow: hidden !important;
        }

        /* हर एक फोटो का साइज और बॉर्डर फिक्स */
        .grid-photo-item {
            width: 30mm !important;  /* 3.0 cm चौड़ाई */
            height: 40mm !important; /* [UPDATED] 4.5cm से घटाकर 4.0cm — 42 फोटो एक पेज में फिट करने के लिए */
            border: 0.5px solid #000000 !important; /* कटिंग के लिए पतली काली बॉर्डर */
            display: flex !important;          /* फ़ोटो को अंदर सही से अलाइन करने के लिए */
            justify-content: center !important;
            align-items: center !important;
            overflow: hidden !important;       /* अगर फ़ोटो बड़ी हो तो बॉक्स से बाहर न निकले */
        }

        .grid-photo-item img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            box-sizing: border-box !important;
        }

        /* प्रिंट करते समय फोटो बीच में से न कटे */
        .grid-photo-item {
            page-break-inside: avoid !important;
        }

        /* प्रिंट करते समय बटन और साइडबार को छुपाने के लिए */
        .sidebar-tools, .control-panel, button, select, input, .no-print, .back-btn {
            display: none !important;
        }

        /* [FIX] बड़ी वजह यहाँ थी — .container अभी भी "1fr 350px" ग्रिड कॉलम्स
           इस्तेमाल कर रहा था, जिससे printSheet को पूरी A4 चौड़ाई नहीं मिल रही थी
           और साइडबार hide होने के बावजूद 350px का खाली column reserved रहता था।
           इसी वजह से content squeeze हो कर 2 pages में overflow हो रहा था। */
        .container, .main-layout {
            display: block !important;
            grid-template-columns: none !important;
            width: 210mm !important;
            max-width: 210mm !important;
            height: auto !important;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            background: #ffffff !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        .workspace-area {
            width: 210mm !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        body {
            display: block !important;
            width: 210mm !important;
            height: 297mm !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }
    }

    
       
/* केवल मोबाइल और टैबलेट स्क्रीन के लिए (स्क्रीन साइज 768px से छोटा होने पर) */
@media screen and (max-width: 768px) {
    /* 1. पूरे लेआउट को एक कॉलम में करना ताकि बटन नीचे साफ दिखें */
    .container, .main-layout, body {
        display: flex !important;
        flex-direction: column !important;
        padding: 10px !important;
        overflow-x: hidden !important;
    }

    /* 2. ए4 शीट को मोबाइल स्क्रीन के हिसाब से छोटा करके फिट करना */
    #printSheet {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        padding: 10px !important;
        /* [FIX] यहाँ भी 1fr हटाया, fixed px रखा ताकि साइज मोबाइल पर भी सही अनुपात में रहे */
        grid-template-columns: repeat(auto-fill, 68px) !important; 
        gap: 6px !important;
        box-shadow: none !important;
        background: #fff !important;
    }

    /* 3. मोबाइल स्क्रीन पर हर फोटो का डिस्प्ले साइज छोटा करना (प्रिंटिंग पर इसका असर नहीं पड़ेगा) */
    .grid-photo-item {
        width: 68px !important;
        height: 88px !important; /* मोबाइल पर दिखने के लिए ऊंचाई, 35:45 अनुपात बनाए रखा */
    }

    /* 4. साइडबार और बटन्स को मोबाइल पर पूरा चौड़ा (Full Width) दिखाना */
    .sidebar-tools, .control-panel {
        width: 100% !important;
        margin-top: 20px !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 12px !important;
    }

    /* 5. तैरते हुए बॉर्डर स्लाइडर को मोबाइल पर सबसे नीचे सही से फिक्स करना */
    div[style*="position: fixed"] {
        position: static !important;
        width: 100% !important;
        box-sizing: border-box !important;
        margin-top: 15px !important;
    }
}

    </style>
</head>

<body>

    <div class="container">
        
        <!-- Left Side: Live Dynamic Sheet Workspace -->
        <div class="workspace-area">
            <div class="print-sheet paper-a4" id="printSheet">
                <!-- JavaScript automatically populates photos here -->
            </div>
        </div>

        <!-- Right Side: Advanced Printing Controls Menu -->
        <div class="sidebar-tools">
            <button class="back-btn" onclick="window.location.href='workshop.html'">← Back</button>
            
            <div>
                <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 3px;"></h2>
                <p style="font-size: 0.8rem; color: #8a99ad;">Grid Matrix & Printing</p>
            </div>

            <!-- SECTION 1: Paper Selector -->
            <div class="tool-box">
                <h3 class="section-title">1. Printing Paper Size</h3>
                <div class="input-group" style="margin-top: 8px;">
                    <select id="paperSizeSelector" onchange="updatePaperType()">
                        <option value="paper_a4">A4 Size Photo Paper</option>
                        <option value="paper_a5">A5 Size Photo Paper</option>
                        <option value="paper_4x6">4 x 6 Inches Glossy Card</option>
                    </select>
                </div>
            </div>

            <!-- SECTION 2: Copies Selection -->
            <div class="tool-box">
                <h3 class="section-title">2. Photos Count (Sankhya)</h3>
                <div class="input-group" style="margin-top: 8px; gap: 12px;">
                    <input type="number" id="photoCountInput" min="1" max="100" value="8" oninput="generateGrid(false)">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #8a99ad; font-size: 0.85rem; text-transform: uppercase;">
                        <input type="checkbox" id="fullPageCheckbox" onchange="generateGrid(this.checked)" style="accent-color: #00d2ff; width: 18px; height: 18px;"> Full Page Fill
                    </label>
                </div>
            </div>

            <!-- Main Print Action Target -->
            <button class="action-btn" style="background: linear-gradient(135deg, #0072ff 0%, #00d2ff 100%); margin-bottom: 10px; width: 100%; color: white; border: none; padding: 14px; font-size: 0.95rem; font-weight: 600; border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px;" onclick="window.print()">Print Layout Sheet ⎙</button>
            <button class="action-btn" style="background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); margin-bottom: 10px; width: 100%; color: white; border: none; padding: 14px; font-size: 0.95rem; font-weight: 600; border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px;" onclick="downloadAsPDF()">Save as PDF Document 📄</button>
            <button class="action-btn" style="background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); width: 100%; color: white; border: none; padding: 14px; font-size: 0.95rem; font-weight: 600; border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px;" onclick="downloadAsImage()">Save as HD Image 🖼️</button>

        </div>
    </div>

    <!-- सबसे पहले लाइब्रेरी लोड करें ताकि यह पूरे पेज को मिल सके -->
     <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        // Memory se photo data, background aur filters fetch karne ka engine
        var savedPhoto = localStorage.getItem("processedPhoto");
        var savedFilters = localStorage.getItem("photoFilter") || "none";
        var savedBg = localStorage.getItem("photoBgColor") || "#ffffff";

        function updatePaperType() {
            var selector = document.getElementById('paperSizeSelector');
            var sheet = document.getElementById('printSheet');
            if (selector && sheet) {
                sheet.className = "print-sheet " + selector.value;
                var isFullPage = document.getElementById('fullPageCheckbox').checked;
                generateGrid(isFullPage);
            }
        }

        function generateGrid(isFullPageFill) {
            var sheet = document.getElementById('printSheet');
            var countInput = document.getElementById('photoCountInput');
            if (!sheet || !countInput) return;

            sheet.innerHTML = ""; 
            var totalPhotos = parseInt(countInput.value) || 0;
            var paperType = document.getElementById('paperSizeSelector').value;
            
            // Layout limits (A4 par ab 30 photos exactly fit ho jayengi single page mein)
            var maxCapacity = 42; 
            if (paperType === "paper_a5") maxCapacity = 16;
            if (paperType === "paper_4x6") maxCapacity = 12;

            if (isFullPageFill) {
                totalPhotos = maxCapacity;
                countInput.disabled = true;
                countInput.style.opacity = "0.4";
            } else {
                countInput.disabled = false;
                countInput.style.opacity = "1";
                if (totalPhotos > maxCapacity) {
                    totalPhotos = maxCapacity;
                    countInput.value = maxCapacity;
                }
            }

            for (var i = 0; i < totalPhotos; i++) {
                var photoDiv = document.createElement('div');
                photoDiv.className = "grid-photo-item";
                photoDiv.style.backgroundColor = savedBg;
                photoDiv.style.position = "relative";
                photoDiv.style.overflow = "hidden";
                photoDiv.style.margin = "0";
                photoDiv.style.padding = "0"; 
                photoDiv.style.border = "none";
                photoDiv.style.boxSizing = "border-box";
                
                if (savedPhoto && savedPhoto !== "") {
                    var img = document.createElement('img');
                    img.src = savedPhoto;
                    img.style.width = "100%";
                    img.style.height = "100%";
                    img.style.objectFit = "cover";
                    img.style.filter = savedFilters;
                    img.style.display = "block";
                    img.style.margin = "0"; 
                    img.style.padding = "0"; 
                    img.style.border = "none";
                    photoDiv.appendChild(img);
                } else {
                    photoDiv.style.backgroundColor = "#ccc"; 
                }
                sheet.appendChild(photoDiv);
            }
        } 

        // Direct PDF Download Framework
        function downloadAsPDF() {
            var element = document.getElementById('printSheet');
            if (typeof html2pdf === 'undefined') {
                alert("PDF Library Load Ho Rahi Hai, Kripya 2 Second Baad Try Karein!");
                return;
            }
            var opt = {
                margin:       0,
                filename:     'passport_photos_sheet.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        function downloadAsImage() {
            var element = document.getElementById('printSheet');
            
            if (!element) {
                element = document.body;
            }

            if (typeof html2canvas === 'undefined') {
                console.log("Library loading...");
                alert("इमेज लाइब्रेरी लोड हो रही है, कृपया 2 सेकंड बाद दोबारा बटन दबाएं!");
                return;
            }

            html2canvas(element, {
                useCORS: true,
                scale: 3, 
                logging: false,
                allowTaint: true,
                backgroundColor: "#ffffff"
            }).then(function(canvas) {
                try {
                    var link = document.createElement('a');
                    link.href = canvas.toDataURL('image/png', 1.0);
                    link.download = 'passport_photos_grid.png';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (error) {
                    console.error("Download error:", error);
                    alert("इमेज सेव करने में दिक्कत आ रही है, कृपया 'Go Live' सर्वर का उपयोग करें।");
                }
            });
        }

        window.addEventListener('DOMContentLoaded', function() {
            generateGrid(false);
        });
    </script>

</body>
</html>
