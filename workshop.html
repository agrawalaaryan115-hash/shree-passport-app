<!DOCTYPE html>
<html lang="hi">
<head>
    <link rel="manifest" href="manifest.json">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Workshop - Passport Photo Maker</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        #photoFrame {
            width: 320px;
            height: 411px;
            border: 2px dashed #007bff;
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
            cursor: move;
            margin: 0 auto;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a1f36 0%, #0a0c16 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            display: grid;
            grid-template-columns: 1fr 380px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .preview-area {
            background: #090b11;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            min-height: 450px;
        }

        .photo-canvas-wrapper {
            width: 320px;
            height: 411px;
            border: 2px dashed #00d2ff;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .upload-trigger {
            text-align: center;
            padding: 20px;
            color: #00d2ff;
            pointer-events: none;
        }

        #previewImage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            pointer-events: none;
            display: none;
        }

        .sidebar-tools {
            background: rgba(13, 16, 28, 0.85);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #00d2ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .tool-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 16px;
        }

        .input-group select {
            background: #141829;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            width: 100%;
        }

        .size-badge {
            display: inline-block;
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-top: 8px;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slider-item label {
            font-size: 0.85rem;
            color: #8a99ad;
            display: flex;
            justify-content: space-between;
        }

        .slider-item input[type="range"] {
            width: 100%;
            accent-color: #00d2ff;
            background: #1a1f36;
            height: 6px;
            border-radius: 5px;
            cursor: pointer;
        }

        .next-btn {
            background: linear-gradient(135deg, #0072ff 0%, #00d2ff 100%);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            body {
                height: 100vh;
                overflow: hidden;
                padding: 5px;
                display: flex;
                align-items: stretch;
            }

            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                height: 100%;
                max-height: 100%;
                border-radius: 12px;
                overflow: hidden;
            }

            .preview-area {
                padding: 10px;
                min-height: auto;
                height: 240px;
                background: #000000;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            #photoFrame {
                transform: scale(0.55);
                transform-origin: center center;
                margin: 0 auto;
            }

            .sidebar-tools {
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.08);
                padding: 12px;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: 6px;
                height: calc(100vh - 250px);
            }

            .tool-box {
                padding: 8px 12px;
                border-radius: 10px;
            }
            .input-group select {
                padding: 8px;
                font-size: 0.85rem;
            }
            .next-btn {
                padding: 10px;
                font-size: 0.95rem;
                margin-top: 5px;
            }
            .section-title {
                font-size: 0.85rem;
            }
        }

        input[type="range"]::-webkit-slider-thumb:focus {
            outline: none !important;
            box-shadow: none !important;
        }
        input[type="range"]::-moz-range-thumb:focus {
            outline: none !important;
            box-shadow: none !important;
        }
        #borderSlider:focus {
            outline: none !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Left Side: Photo Frame Click Box -->
        <div class="preview-area">
            <label for="actualFileInput" class="photo-canvas-wrapper" id="photoFrame">

                <img id="previewImage" alt="Preview" onmousedown="startDragging(event)" ontouchstart="startDragging(event)">

                <div class="upload-trigger" id="uploadText">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                    <p style="font-size: 0.9rem; font-weight: 500; margin-top: 8px;">Tap to Upload Photo</p>
                </div>

                <input type="file" id="actualFileInput" accept="image/*" style="display: none;" onchange="processPhoto(event)">
            </label>
        </div>

        <!-- Right Side: Tools Panel -->
        <div class="sidebar-tools">
            <div>
                <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 3px;">AI Photo Workshop</h2>
                <p style="font-size: 0.8rem; color: #8a99ad;">Step 2: Custom Size & Enhancements</p>
            </div>

            <div class="tool-box">
                <h3 class="section-title">1. Document Type & Size</h3>
                <div class="input-group" style="margin-top: 8px;">
                    <select id="photoSizeSelector" onchange="updatePhotoRatio()">
                        <option value="in_passport">India - Passport (3.5 x 4.5 cm)</option>
                        <option value="in_visa">India - Visa (5.1 x 5.1 cm / 2x2")</option>
                        <option value="in_pan">India - PAN Card (2.5 x 3.5 cm)</option>
                        <option value="us_passport">United States - Passport (2x2")</option>
                        <option value="uk_passport">United Kingdom - Passport (3.5 x 4.5 cm)</option>
                        <option value="eu_passport">Schengen Europe - Passport (3.5 x 4.5 cm)</option>
                        <option value="ca_passport">Canada - Passport (5.0 x 7.0 cm)</option>
                        <option value="au_passport">Australia - Passport (3.5 x 4.5 cm)</option>
                        <option value="ae_visa">UAE / Dubai - Visa (4.3 x 5.5 cm)</option>
                        <option value="cn_passport">China - Passport (3.3 x 4.8 cm)</option>
                        <option value="stamp_size">Standard Stamp Size (2.0 x 2.5 cm)</option>
                        <option value="custom">Custom Ratio (Free Crop)</option>
                    </select>
                </div>
                <div class="size-badge" id="dimensionDisplay">Target Size: 35mm x 45mm</div>
            </div>

            <div class="tool-box">
                <h3 class="section-title">2. Enhance Adjustments</h3>
                <div class="slider-group">
                    <div class="slider-item">
                        <label>Brightness <span id="brightnessVal">100%</span></label>
                        <input type="range" id="brightnessSlider" min="50" max="150" value="100" oninput="applyFilters()">
                    </div>
                    <div class="slider-item">
                        <label>Contrast <span id="contrastVal">100%</span></label>
                        <input type="range" id="contrastSlider" min="50" max="150" value="100" oninput="applyFilters()">
                    </div>
                    <div style="position: relative; margin-top: 15px; background: #222; padding: 15px; border-radius: 8px; border: 2px solid #00d2ff; width: 100%; box-sizing: border-box;">
                        <p style="font-size: 0.9rem; font-weight: 500; margin-bottom: 8px; color: #fff; text-align: left; margin-top:0;">Border Thickness (बॉर्डर मोटाई)</p>
                        <input type="range" id="borderSlider" min="0" max="8" step="1" value="1" oninput="adjustPhotoBorder()" style="width: 100%; cursor: pointer; outline: none;">
                        <div style="text-align: right; margin-top: 4px;"><span id="border-val" style="font-size: 0.8rem; color: #00d2ff; font-weight: bold;">1px</span></div>
                    </div>
                </div>
            </div>

            <!-- Zoom Buttons -->
            <div style="margin: 20px 0; text-align: center;">
                <p style="font-size: 0.9rem; font-weight: 500; margin-bottom: 8px; color: #fff;">Zoom Photo (कंधे तक सेट करें)</p>
                <button type="button" onclick="zoomPhoto(0.1)" style="padding: 8px 20px; font-size: 1.2rem; margin-right: 10px; cursor: pointer; background: #007bff; color: #fff; border: none; border-radius: 4px; font-weight: bold;">+</button>
                <button type="button" onclick="zoomPhoto(-0.1)" style="padding: 8px 20px; font-size: 1.2rem; cursor: pointer; background: #6c757d; color: #fff; border: none; border-radius: 4px; font-weight: bold;">-</button>
            </div>

            <button class="next-btn" onclick="goToStudio()">Proceed to Layout Studio →</button>
        </div>
    </div>

    <script>
        function updatePhotoRatio() {
            const selector = document.getElementById("photoSizeSelector");
            const photoFrame = document.getElementById("photoFrame");
            const sizeBadge = document.getElementById("dimensionDisplay");

            if (!selector || !photoFrame) return;

            const selectedValue = selector.value;

            if (selectedValue === "in_passport") {
                photoFrame.style.width = "320px";
                photoFrame.style.height = "411px";
                if (sizeBadge) sizeBadge.textContent = "Target Size: 35mm x 45mm";
            }
            else if (selectedValue === "in_visa" || selectedValue === "us_passport") {
                photoFrame.style.width = "350px";
                photoFrame.style.height = "350px";
                if (sizeBadge) sizeBadge.textContent = "Target Size: 51mm x 51mm";
            }
            else if (selectedValue === "in_pan") {
                photoFrame.style.width = "250px";
                photoFrame.style.height = "350px";
                if (sizeBadge) sizeBadge.textContent = "Target Size: 25mm x 35mm";
            }
            else if (selectedValue === "uk_passport" || selectedValue === "eu_passport" || selectedValue === "au_passport") {
                photoFrame.style.width = "320px";
                photoFrame.style.height = "411px";
                if (sizeBadge) sizeBadge.textContent = "Target Size: 35mm x 45mm";
            }
            else if (selectedValue === "ca_passport") {
                photoFrame.style.width = "350px";
                photoFrame.style.height = "490px";
                if (sizeBadge) sizeBadge.textContent = "Target Size: 50mm x 70mm";
            }
            else if (selectedValue === "ae_visa") {
                photoFrame.style.width = "344px";
                photoFrame.style.height = "440px";
                if (sizeBadge) sizeBadge.textContent = "Target Size: 43mm x 55mm";
            }
            else if (selectedValue === "cn_passport") {
                photoFrame.style.width = "300px";
                photoFrame.style.height = "436px";
                if (sizeBadge) sizeBadge.textContent = "Target Size: 33mm x 48mm";
            }
            else if (selectedValue === "stamp_size") {
                photoFrame.style.width = "200px";
                photoFrame.style.height = "250px";
                if (sizeBadge) sizeBadge.textContent = "Target Size: 20mm x 25mm";
            }
            else if (selectedValue === "custom") {
                photoFrame.style.width = "350px";
                photoFrame.style.height = "350px";
                if (sizeBadge) sizeBadge.textContent = "Custom Ratio (Free Crop)";
            }
        }

        // 1. GLOBAL VARIABLES
        var currentScale = 1.0;
        var finalPhotoData = "";
        var isDragging = false;
        var startX, startY, imgLeft = 0, imgTop = 0;

        // 2. PHOTO UPLOAD ENGINE
        function processPhoto(event) {
            var input = event.target || event;
            var files = input.files;

            if (files && files.length > 0) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var img = document.getElementById('previewImage');
                    var text = document.getElementById('uploadText');

                    finalPhotoData = e.target.result;

                    if (img && text) {
                        img.src = finalPhotoData;
                        img.style.display = 'block';
                        img.style.width = '100%';
                        img.style.height = '100%';
                        img.style.objectFit = 'cover';
                        img.style.objectPosition = 'center 20%';
                        img.style.position = 'absolute';

                        imgLeft = 0;
                        imgTop = 0;
                        img.style.left = '0px';
                        img.style.top = '0px';
                        currentScale = 1.0;
                        img.style.transform = 'scale(' + currentScale + ')';

                        text.style.display = 'none';
                    }
                };
                reader.readAsDataURL(files[0]);
            }
        }

        // 3. BRIGHTNESS & CONTRAST ENGINE
        function applyFilters() {
            var img = document.getElementById('previewImage');
            var bSlider = document.getElementById('brightnessSlider');
            var cSlider = document.getElementById('contrastSlider');
            var bValText = document.getElementById('brightnessVal');
            var cValText = document.getElementById('contrastVal');

            if (!img) return;

            var bValue = bSlider ? bSlider.value : 100;
            var cValue = cSlider ? cSlider.value : 100;

            if (bValText) bValText.innerText = bValue + '%';
            if (cValText) cValText.innerText = cValue + '%';

            img.style.filter = 'brightness(' + bValue + '%) contrast(' + cValue + '%)';
        }

        // 4. ZOOM
        function zoomPhoto(value) {
            var img = document.getElementById('previewImage');
            if (!img || img.style.display !== 'block') return;

            currentScale += value;
            if (currentScale < 0.4) currentScale = 0.4;
            if (currentScale > 3.0) currentScale = 3.0;

            img.style.transform = 'scale(' + currentScale + ')';
        }

        // 5. DRAG TO REPOSITION (mouse + touch/finger dono ke liye)
        function getPointerXY(e) {
            // Agar touch event hai to uske andar se touches[0] nikalna,
            // warna normal mouse event ka clientX/clientY use karna
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            if (e.changedTouches && e.changedTouches.length > 0) {
                return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function startDragging(e) {
            if (e.target.id === 'previewImage') {
                e.preventDefault();
                e.stopPropagation();
            } else {
                return;
            }

            isDragging = true;
            var img = document.getElementById('previewImage');
            var pos = getPointerXY(e);

            startX = pos.x - imgLeft;
            startY = pos.y - imgTop;

            function moveHandler(event) {
                if (!isDragging) return;
                event.preventDefault();

                var movePos = getPointerXY(event);
                imgLeft = movePos.x - startX;
                imgTop = movePos.y - startY;

                img.style.left = imgLeft + 'px';
                img.style.top = imgTop + 'px';
            }

            function endHandler() {
                isDragging = false;
                document.onmousemove = null;
                document.onmouseup = null;
                document.removeEventListener('touchmove', moveHandler);
                document.removeEventListener('touchend', endHandler);
            }

            // Mouse ke liye
            document.onmousemove = moveHandler;
            document.onmouseup = endHandler;

            // Finger/touch ke liye
            document.addEventListener('touchmove', moveHandler, { passive: false });
            document.addEventListener('touchend', endHandler);
        }

        // 6. MOUSE WHEEL ZOOM
        document.addEventListener('DOMContentLoaded', function() {
            var frame = document.getElementById('photoFrame');
            if (frame) {
                frame.addEventListener('wheel', function(e) {
                    var img = document.getElementById('previewImage');
                    if (!img || img.style.display !== 'block') return;

                    e.preventDefault();
                    if (e.deltaY < 0) {
                        currentScale += 0.05;
                    } else {
                        currentScale -= 0.05;
                    }
                    if (currentScale < 0.3) currentScale = 0.3;
                    if (currentScale > 3.0) currentScale = 3.0;
                    img.style.transform = 'scale(' + currentScale + ')';
                });

                frame.addEventListener('click', function(e) {
                    var img = document.getElementById('previewImage');
                    if (img && img.style.display === 'block') {
                        if (e.target.id === 'previewImage') {
                            e.preventDefault();
                        }
                    }
                });
            }
        });

        // 7. BORDER THICKNESS
        function adjustPhotoBorder() {
            var slider = document.getElementById('borderSlider');
            if (!slider) return;

            var thickness = slider.value;
            var borderValSpan = document.getElementById('border-val');
            if (borderValSpan) {
                borderValSpan.innerText = thickness + "px";
            }

            var previewImg = document.getElementById('previewImage');
            if (previewImg) {
                if (parseFloat(thickness) === 0) {
                    previewImg.style.boxShadow = "none";
                } else {
                    previewImg.style.boxShadow = "inset 0 0 0 " + thickness + "px #000000";
                }
            }

            var frame = document.getElementById('photoFrame') || (previewImg ? previewImg.parentElement : null);
            if (frame) {
                if (parseFloat(thickness) === 0) {
                    frame.style.boxShadow = "none";
                } else {
                    frame.style.boxShadow = "inset 0 0 0 " + thickness + "px #000000";
                }
            }
        }

        // 8. GO TO STUDIO (canvas render + navigation)
        function goToStudio() {
            var img = document.getElementById('previewImage');
            var frame = document.getElementById('photoFrame');
            var slider = document.getElementById('borderSlider');

            if (finalPhotoData && finalPhotoData !== "") {

                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');

                canvas.width = 350;
                canvas.height = 450;

                var bgColor = (frame && frame.style.backgroundColor) ? frame.style.backgroundColor : "#ffffff";
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (img) {
                    ctx.save();

                    var bSlider = document.getElementById('brightnessSlider');
                    var cSlider = document.getElementById('contrastSlider');
                    var bVal = bSlider ? bSlider.value : 100;
                    var cVal = cSlider ? cSlider.value : 100;
                    ctx.filter = 'brightness(' + bVal + '%) contrast(' + cVal + '%)';

                    var rect = frame.getBoundingClientRect();
                    var scaleX = canvas.width / rect.width;
                    var scaleY = canvas.height / rect.height;

                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.translate(imgLeft * scaleX, imgTop * scaleY);
                    ctx.scale(currentScale, currentScale);
                    ctx.translate(-canvas.width / 2, -canvas.height / 2);

                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    ctx.restore();
                }

                var thickness = slider ? parseFloat(slider.value) : 0;
                if (thickness > 0) {
                    var canvasThickness = thickness * (canvas.width / frame.clientWidth);
                    ctx.strokeStyle = "#000000";
                    ctx.lineWidth = canvasThickness;
                    ctx.strokeRect(canvasThickness / 2, canvasThickness / 2, canvas.width - canvasThickness, canvas.height - canvasThickness);
                }

                var compiledPhoto = canvas.toDataURL("image/jpeg", 0.95);
                localStorage.setItem("processedPhoto", compiledPhoto);
                localStorage.setItem("photoFilter", "none");
                localStorage.setItem("photoBgColor", bgColor);

                window.location.href = "studio.html";

            } else {
                alert("कृपया आगे बढ़ने से पहले एक फोटो अपलोड करें!");
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            var slider = document.getElementById('borderSlider');
            if (slider) {
                slider.addEventListener('input', adjustPhotoBorder);
                slider.addEventListener('change', adjustPhotoBorder);
            }
            setTimeout(adjustPhotoBorder, 200);
        });
    </script>

</body>
</html>
